# run_hardware.py config for the real Franka Panda + Franka Hand
# (HardwareFrankaPanda). The arm runs in the C++ bridge (bridge.yaml), the
# hand in Python.
name: franka_panda

# Rate of the hand command + hand joint_meas publish (Hz).
hardware_freq: 1000

# Dry-run: read and publish the hand but never command it.
read_only: false

# Hand falls back to default_q when the last command is older than this (s).
ctrl_timeout: 0.5

arm:
  bridge_binary: communication/franka/build/franka_bridge
  bridge_config: configs/franka_panda/hardware/bridge.yaml
  # where libfranka.so lives (prepended to LD_LIBRARY_PATH for the bridge)
  bridge_ld_library_path: ~/libfranka/build

hand:
  robot_ip: 172.16.0.2
  # Franka Hand only takes width targets (franka::Gripper::move).
  control_mode: POSITION_CONTROL
  # [finger_joint1, finger_joint2], 0 (closed) .. 0.04 m (open). Held when no
  # fresh command arrives.
  default_q: [0.04, 0.04]
  speed: 0.05      # m/s
  width_tol: 0.002 # m, smaller target changes are not sent
  homing: false    # true: calibrate the stroke at start (fingers open + close)

sub_manager:
  name: joint
  ctrl_channel: hw_franka_arm_hand_joint_ctrl
  num_joints: 9
  max_sub_freq: 2000

pub_manager:
  name: franka_hand
  hand_joint_meas_channel: hw_franka_hand_joint_meas
  max_pub_freq: 2000
