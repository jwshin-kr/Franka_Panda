name: default_mujoco
scene_xml_path: assets/scene/franka_panda/panda_default.xml

env_mode: sim_real_time
# env_mode: sim_sim_time
vis_mode: vis_on

# Keep at 1 in SIM_REAL_TIME so each env tick advances sim time by exactly one
# sim_dt and the publish rate matches the *_joint_meas_freq cleanly.
sim_steps_per_control: 1

sim_freq: 1000
view_freq: 30

# Rate at which the platform publishes joint_meas_t over LCM.
arm_joint_meas_freq: 1000
hand_joint_meas_freq: 1000

platform:
  name: franka_panda
  # [arm(7), hand(2)] = 9. Arm at [0, 0, 0, -90, 0, 90, 45] deg -> rad (the
  # canonical Franka "ready" pose leans the elbow into wall_back of this cell);
  # hand open (0.04 m per finger). Matches the controller's default_q so the
  # sim starts at the target.
  default_q_values: [
    0.0, 0.0, 0.0, -1.5707963, 0.0, 1.5707963, 0.7853982,
    0.04, 0.04,
  ]
  # No plant-side gravity comp: gravity comp is the controller's
  # responsibility (Pinocchio, from the robot state), so the command's tau_ff
  # must include it. With this false, a zero-torque command lets the arm fall.
  gravity_comp: false

sub_manager:
  name: joint
  ctrl_channel: sw_franka_arm_hand_joint_ctrl
  num_joints: 9
  max_sub_freq: 2000

pub_manager:
  name: franka_arm_hand
  arm_joint_meas_channel: sw_franka_arm_joint_meas
  hand_joint_meas_channel: sw_franka_hand_joint_meas
  max_pub_freq: 2000
