name: franka_panda_col
scene_xml_path: assets/scene/franka_panda/panda_default.xml

env_mode: sim_real_time
vis_mode: vis_on

sim_steps_per_control: 1
sim_freq: 1000
view_freq: 30

arm_joint_meas_freq: 1000
hand_joint_meas_freq: 1000

# How often the collision geometry is (re)published (s).
col_info_update_dt: 0.1

platform:
  name: franka_panda
  # arm [0,0,0,-90,0,90,45] deg -> rad; hand open.
  default_q_values: [
    0.0, 0.0, 0.0, -1.5707963, 0.0, 1.5707963, 0.7853982,
    0.04, 0.04,
  ]
  # Controller supplies its own gravity comp (Pinocchio); no plant-side comp.
  gravity_comp: false

sub_manager:
  name: joint
  ctrl_channel: sw_franka_arm_hand_joint_ctrl
  num_joints: 9
  max_sub_freq: 2000

pub_manager:
  name: franka_arm_hand_col_info
  arm_joint_meas_channel: sw_franka_arm_joint_meas
  hand_joint_meas_channel: sw_franka_hand_joint_meas
  static_col_info_channel: sw_franka_arm_hand_static_col_info
  robot_col_info_channel: sw_franka_arm_hand_robot_col_info
  max_pub_freq: 2000
