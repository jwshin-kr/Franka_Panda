name: franka_arm_hand_cam
scene_xml_path: assets/scene/franka_fr3/fr3_cam_calib.xml

env_mode: sim_real_time
vis_mode: vis_on

sim_steps_per_control: 1
sim_freq: 1000
view_freq: 30

arm_joint_meas_freq: 200
hand_joint_meas_freq: 200

viewer_cam:
  distance: 1.8
  elevation: -25
  azimuth: 50
  lookat: [0.3, 0.1, 0.35]

# Arm at a reachable pose visible from calib_camera; gripper open.
platform:
  name: franka_fr3
  # [arm(7), gripper(1)] = 8. Arm at [0, 0, 0, -90, 0, 90, 0] deg -> rad;
  # Robotiq 2F-85 open (driver angle 0 rad; 0.8 = closed).
  default_q_values: [
    0.0, 0.0, 0.0, -1.5707963, 0.0, 1.5707963, 0.0,
    0.0,
  ]
  # Controller owns gravity (GravCompControl). Keep false to avoid double g(q).
  gravity_comp: false
  # Must live under platform so get_sim_platform merges them into SimFrankaFR3.
  arm_joint_meas_freq: 200
  hand_joint_meas_freq: 200

sensor:
  extrinsic:
    calib_camera:
      width: 640
      height: 480
      rgb_enable: True
      depth_enable: True
      frequency: 15
      fixed: True
      attached_body: world
      depth_factor: 1.0

sub_manager:
  name: joint
  ctrl_channel: sw_franka_arm_hand_joint_ctrl
  num_joints: 8
  max_sub_freq: 2000

pub_manager:
  name: franka_arm_hand_cam
  arm_joint_meas_channel: sw_franka_arm_joint_meas
  hand_joint_meas_channel: sw_franka_gripper_joint_meas
  calib_camera_channel: calib_camera
  max_pub_freq: 2000
