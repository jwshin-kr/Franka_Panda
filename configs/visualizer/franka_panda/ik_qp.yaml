name: franka_panda
vis_freq: 30

franka_panda:
  arm_joint_meas_channel: sw_franka_arm_joint_meas
  hand_joint_meas_channel: sw_franka_hand_joint_meas
  num_arm_joints: 7
  num_hand_joints: 2

  urdf_path: assets/scene/franka_panda/urdf/panda_viser.urdf
  mesh_dir: ""

  robot_col_info_channel: sw_franka_arm_hand_robot_col_info
  static_col_info_channel: sw_franka_arm_hand_static_col_info

  # IK target published by ik_qp controller.
  target_pose_channel: sw_ik_target_pose

  col_dist_thr: 0.10

  col_pairs:
    - ["link2", "wall_back"]
    - ["link2", "wall_left"]
    - ["link3", "wall_back"]
    - ["link3", "wall_left"]
    - ["link3", "floor"]
    - ["link4", "wall_back"]
    - ["link4", "wall_left"]
    - ["link4", "floor"]
    - ["link5", "wall_back"]
    - ["link5", "wall_left"]
    - ["link5", "floor"]
    - ["link6", "wall_back"]
    - ["link6", "wall_left"]
    - ["link6", "floor"]
    - ["link7", "wall_back"]
    - ["link7", "wall_left"]
    - ["link7", "floor"]
    - ["hand", "wall_back"]
    - ["hand", "wall_left"]
    - ["hand", "floor"]

  self_col_pairs:
    - ["hand", "link1"]
    - ["hand", "link2"]
    - ["hand", "link3"]
    - ["link7", "link1"]
    - ["link7", "link2"]
    - ["link7", "link3"]
    - ["link6", "link1"]
    - ["link6", "link2"]
    - ["link5", "link1"]
    - ["link5", "link2"]
