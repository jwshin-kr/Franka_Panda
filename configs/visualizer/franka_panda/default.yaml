name: franka_panda
vis_freq: 30

franka_panda:
  # Channels the sim env publishes joint_meas_t on (SimFrankaPanda).
  arm_joint_meas_channel: sw_franka_arm_joint_meas
  hand_joint_meas_channel: sw_franka_hand_joint_meas
  num_arm_joints: 7
  num_hand_joints: 2

  # Panda arm + hand + robot cell URDF. Uses relative mesh paths, so it loads
  # directly (no rewrite needed).
  urdf_path: assets/scene/franka_panda/urdf/panda_viser.urdf
  # Optional yourdfpy mesh_dir override; leave blank to use the URDF's own paths.
  mesh_dir: ""
