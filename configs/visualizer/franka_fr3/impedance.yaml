name: franka_fr3
vis_freq: 30

franka_fr3:
  arm_joint_meas_channel: sw_franka_arm_joint_meas
  hand_joint_meas_channel: sw_franka_gripper_joint_meas
  num_arm_joints: 7
  num_hand_joints: 1

  urdf_path: assets/scene/franka_fr3/urdf/fr3_robotiq_viser.urdf
  mesh_dir: ""

  # Impedance overlays / gain tuning (tutorial 08).
  impedance_status_channel: sw_imp_status
  impedance_gains_cmd_channel: sw_imp_gains_cmd
  impedance_frame_axes_length: 0.08
  kq_scale: 1.0
  dq_scale: 1.0
  kt_trans_scale: 1.0
  kt_rot_scale: 1.0
  dt_trans_scale: 1.0
  dt_rot_scale: 1.0
